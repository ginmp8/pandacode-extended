name: Temporary Branch Snapshot
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/branch-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/0.6.0-upstream-0.3.49-0.3.50'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive current source without running it
        run: git archive --format=zip --output="$RUNNER_TEMP/current.zip" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: current-extended-source
          path: ${{ runner.temp }}/current.zip
          retention-days: 1
          compression-level: 0
