name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    name: Typecheck, unit tests, website
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci --prefix website
      # `npm run build` typechecks (tsc --noEmit) and writes dist/, which
      # tests/bundle.test.mjs reads.
      - run: npm run build
      - run: npm test
      - run: npm run test:release
      - run: npm run site:build

  chat-ui:
    name: Desktop integration Playwright regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run chat and thread-order browser tests twice
        run: |
          set -euo pipefail
          # An existing thread-order screenshot test uses this macOS path.
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp
          export PANDACODE_TEST_CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -x "$PANDACODE_TEST_CHROME"
          npx playwright test tests/chats.spec.ts tests/thread-order.spec.ts --workers=1 --repeat-each=2
      - name: Run upstream integration and GitHub workflow regressions
        run: |
          set -euo pipefail
          export PANDACODE_TEST_CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -x "$PANDACODE_TEST_CHROME"
          npx playwright test tests/provider-handoff.spec.ts tests/changes-view.spec.ts tests/inspector-tabs.spec.ts tests/sidebar-sections.spec.ts tests/remote-progress.spec.ts tests/remote-first-message.spec.ts tests/remote-images.spec.ts tests/provider-settings.spec.ts tests/board.spec.ts tests/github-hub.spec.ts tests/github.spec.ts --workers=2
      - name: Preserve failed desktop browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-playwright-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  historical-ui:
    name: Historical parity Playwright regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run historical parity, bot, document and permission regressions
        run: |
          set -euo pipefail
          sudo mkdir -p /private/tmp
          sudo chmod 1777 /private/tmp
          export PANDACODE_TEST_CHROME="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          test -x "$PANDACODE_TEST_CHROME"
          npx playwright test 'historical-.*.spec.ts' tests/office-viewer.spec.ts tests/document-viewer.spec.ts tests/bots.spec.ts tests/bots-web.spec.ts tests/bots-profile.spec.ts tests/approval-modes.spec.ts tests/tray-popover.spec.ts tests/inspector-new-task.spec.ts tests/jev.spec.ts tests/jev-assist.spec.ts tests/jev-live.spec.ts tests/agent-usage.spec.ts tests/browser.spec.ts tests/history-upgrade.spec.ts tests/overlay.spec.ts tests/vm.spec.ts tests/deploy.spec.ts tests/streaming.spec.ts tests/support.spec.ts --workers=2
      - name: Preserve failed historical browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: historical-playwright-failure-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
          include-hidden-files: false

  connect:
    name: Connect (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [mobile, relay]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci --ignore-scripts --prefix ${{ matrix.package }}
      - run: npm test --prefix ${{ matrix.package }}
      - run: npm run typecheck --prefix ${{ matrix.package }}
      - if: matrix.package == 'mobile'
        run: npm run lint --prefix mobile
        env:
          EXPO_NO_TELEMETRY: '1'

  rust:
    name: Rust check and tests (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xvfb dbus-x11 xdg-utils
      # Tauri embeds the built frontend, so dist/ must exist before cargo runs.
      - run: npm ci
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
