name: One-shot experimental upstream main source import
on:
  push:
    branches: ['integration/0.7.0-main-to-main']
    paths: ['.github/workflows/experimental-upstream-merge-import.yml']
permissions:
  contents: write
concurrency:
  group: experimental-main-to-main-import
  cancel-in-progress: false
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Synthesize reviewed-boundary upstream source candidate
        env:
          GIT_TERMINAL_PROMPT: '0'
          GIT_LFS_SKIP_SMUDGE: '1'
        run: python3 scripts/integration/upstream_main_merge.py
      - name: Preserve source comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: main-to-main-wip-import-merge-evidence
          path: /tmp/main-to-main-import/
          retention-days: 14
          if-no-files-found: warn
