# Temporary, branch-scoped lockfile regeneration for a confirmed RustSec advisory.
# Remove this workflow after the dependency lockfile is committed and verified.
name: One-time SQLite lockfile refresh
on:
  push:
    branches: [feat/129-customize-skills-hub]
    paths:
      - .github/workflows/fix-ci-sqlite-lock.yml
      - src-tauri/Cargo.toml
permissions:
  contents: write
jobs:
  refresh:
    name: Resolve and commit patched SQLite dependency
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      - name: Resolve the fixed rusqlite dependency
        run: |
          cargo update --manifest-path src-tauri/Cargo.toml -p rusqlite --precise 0.41.1
          cargo metadata --locked --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps > /dev/null
          git diff --check
          test "$(sed -n '/^name = "libsqlite3-sys"$/,+1p' src-tauri/Cargo.lock | tail -1)" != 'version = "0.36.0"'
          git diff -- src-tauri/Cargo.lock
      - name: Commit the resolved lockfile (only on the unchanged PR head)
        run: |
          git fetch origin "refs/heads/${GITHUB_REF_NAME}"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore(deps): lock patched rusqlite and SQLite C library"
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
      - name: Preserve the resolved lockfile for diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sqlite-resolved-cargo-lock
          path: src-tauri/Cargo.lock
          retention-days: 2
