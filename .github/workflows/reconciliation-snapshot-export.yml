name: Temporary virtual-base reconciliation diagnostics
on:
  push:
    branches: [chore/pr120-reconcile-base-20261110]
permissions:
  contents: read
jobs:
  reconcile-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect source increment since last imported source snapshot
        shell: bash
        env:
          SOURCE_SHA: e4e5c0c51daa8a0149015bb26a00c8fb09bb2050
          TARGET_SHA: 6467995ea3b533b039bcd393e4e6a15e847f5464
          PREVIOUS_SOURCE_SHA: 4f777ec3414a9c46d07ea58debb99c87fcf4e74f
        run: |
          set -euo pipefail
          git config user.name "Reconciliation Diagnostics"
          git config user.email "reconciliation@users.noreply.github.com"
          previous_tree=$(git rev-parse "$PREVIOUS_SOURCE_SHA^{tree}")
          source_tree=$(git rev-parse "$SOURCE_SHA^{tree}")
          target_tree=$(git rev-parse "$TARGET_SHA^{tree}")
          virtual_base=$(printf 'Virtual base: previous imported source\n' | git commit-tree "$previous_tree")
          virtual_source=$(printf 'Virtual source: current base/development tree\n' | git commit-tree "$source_tree" -p "$virtual_base")
          virtual_target=$(printf 'Virtual target: PR 120 head\n' | git commit-tree "$target_tree" -p "$virtual_base")
          git switch -c virtual-reconcile "$virtual_target"
          git merge --no-commit --no-ff "$virtual_source" || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          echo "::group::Virtual-base conflicts"
          cat "$RUNNER_TEMP/conflicts.txt"
          echo "conflicts=$(wc -l < "$RUNNER_TEMP/conflicts.txt")"
          echo "::endgroup::"
          python3 - "$RUNNER_TEMP/conflicts.txt" <<'PY'
          from pathlib import Path
          import sys
          for filename in Path(sys.argv[1]).read_text().splitlines():
              path = Path(filename)
              if not path.exists() or not path.is_file():
                  continue
              body = path.read_text(errors='replace')
              spans = body.split('<<<<<<< HEAD')
              if len(spans) < 2:
                  continue
              print(f"=== {filename} ({len(spans)-1} blocks) ===")
              for part in spans[1:]:
                  block = part.split('>>>>>>>', 1)[0]
                  rows = block.splitlines()
                  for line in rows[:16]:
                      print(line[:220])
                  if len(rows) > 16:
                      print(f"... {len(rows)-16} additional conflict lines")
          PY
          mkdir -p "$RUNNER_TEMP/conflict-files"
          while IFS= read -r name; do
            test -n "$name" || continue
            mkdir -p "$RUNNER_TEMP/conflict-files/$(dirname "$name")"
            cp "$name" "$RUNNER_TEMP/conflict-files/$name" || true
          done < "$RUNNER_TEMP/conflicts.txt"
          cp "$RUNNER_TEMP/conflicts.txt" "$RUNNER_TEMP/conflict-files/conflicts.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: virtual-base-reconciliation-conflicts
          path: ${{ runner.temp }}/conflict-files
          if-no-files-found: error
          retention-days: 3
