name: Temporary reconciliation diagnostics
on:
  push:
    branches:
      - chore/pr120-reconcile-base-20261110
permissions:
  contents: read
jobs:
  merge-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect three-way merge without committing
        shell: bash
        env:
          SOURCE_SHA: e4e5c0c51daa8a0149015bb26a00c8fb09bb2050
          TARGET_SHA: 6467995ea3b533b039bcd393e4e6a15e847f5464
          BASE_SHA: dbd4e3f39685603bff21069439edf5e5201e021d
        run: |
          set -euo pipefail
          test "$(git merge-base "$SOURCE_SHA" "$TARGET_SHA")" = "$BASE_SHA"
          echo "::group::Merge tree summary"
          git merge-tree --write-tree --name-only "$TARGET_SHA" "$SOURCE_SHA" > "$RUNNER_TEMP/merge-tree.txt" || true
          head -220 "$RUNNER_TEMP/merge-tree.txt"
          echo "::endgroup::"
          git switch -c diagnostic-reconcile "$TARGET_SHA"
          git -c user.name=Reconciler -c user.email=reconciler@users.noreply.github.com merge --no-commit --no-ff "$SOURCE_SHA" || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          echo "::group::Unmerged paths"
          cat "$RUNNER_TEMP/conflicts.txt"
          echo "::endgroup::"
          echo "conflicts=$(wc -l < "$RUNNER_TEMP/conflicts.txt")"
          mkdir -p "$RUNNER_TEMP/conflict-files"
          while IFS= read -r name; do
            test -n "$name" || continue
            mkdir -p "$RUNNER_TEMP/conflict-files/$(dirname "$name")"
            cp "$name" "$RUNNER_TEMP/conflict-files/$name" || true
          done < "$RUNNER_TEMP/conflicts.txt"
          cp "$RUNNER_TEMP/merge-tree.txt" "$RUNNER_TEMP/conflict-files/merge-tree.txt"
          cp "$RUNNER_TEMP/conflicts.txt" "$RUNNER_TEMP/conflict-files/conflicts.txt"
      - name: Upload bounded diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reconciliation-diagnostics
          path: ${{ runner.temp }}/conflict-files
          if-no-files-found: error
          retention-days: 3
