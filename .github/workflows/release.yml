name: Release
# Tags vX.Y.Z build the native PandaCode app without changing its upstream version.
# Extended tags use releases/extended/X.Y.Z.md; original app tags use releases/X.Y.Z.md.
# Tag pushes upload workflow artifacts only. A GitHub Release requires explicit manual
# approval via workflow_dispatch. This Extended workflow never publishes to npm.
# See docs/extended/releasing.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Create the GitHub Release (tags vX.Y.Z at this commit if needed)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_version: ${{ steps.version.outputs.release_version }}
      release_notes: ${{ steps.version.outputs.release_notes }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_title: ${{ steps.version.outputs.release_title }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24 runtime)
      - name: Verify pinned upstream source release identity
        run: node --test scripts/release/version-identity.test.mjs
      - name: Resolve application and release identities
        id: version
        run: node scripts/release/resolve-release-identity.mjs >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # transcribe_cmake: TRANSCRIBE_CMAKE_ARGS for transcribe-cpp-sys 0.4.1 (its build.rs passes the
      # variable to CMake when it builds ggml). Rule: never tune ggml to the runner's CPU.
      # - x86_64 rows pin the baseline SSE4.2/AVX/F16C floor (no AVX2+, like ort).
      # - Linux arm64 pins plain ARMv8-A (GGML_NATIVE=OFF + GGML_CPU_ARM_ARCH, ggml's -march).
      # - Apple silicon: the crate's build.rs already sets GGML_NATIVE=OFF on macOS.
      # - Windows arm64 is the one exception: ggml refuses GGML_NATIVE=OFF with MSVC on ARM
      #   ("use clang"), and the clang-cl toolset cannot be chosen here because cmake-rs already
      #   passes -Thost=x64 and CMake allows one -T. So it stays native: the build probes the
      #   runner CPU (dotprod/i8mm on windows-11-arm), which sets that row's CPU floor (see
      #   docs/agent-reference.md#voice-input). The same probe also tests SVE and SME, which
      #   platform.rs does not check and Snapdragon X lacks, so the row pins their cached probe
      #   results off (GGML_MACHINE_SUPPORTS_sve/_sme=OFF, read by ggml-cpu/CMakeLists.txt's
      #   check_arm_feature). Keep ci.yml's Linux x86_64 job and rust-platforms rows in step.
      matrix:
        include:
          - { os: macos-latest, target: darwin-aarch64, triple: aarch64-apple-darwin, transcribe_cmake: '' }
          # Native Intel runner: build.mjs only builds on the target's own host architecture.
          - { os: macos-15-intel, target: darwin-x86_64, triple: x86_64-apple-darwin, transcribe_cmake: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON' }
          - { os: windows-2022, target: windows-x86_64, triple: x86_64-pc-windows-msvc, transcribe_cmake: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON' }
          - { os: windows-11-arm, target: windows-aarch64, triple: aarch64-pc-windows-msvc, transcribe_cmake: '-DGGML_MACHINE_SUPPORTS_sve=OFF -DGGML_MACHINE_SUPPORTS_sme=OFF' }
          - { os: ubuntu-22.04, target: linux-x86_64, triple: x86_64-unknown-linux-gnu, transcribe_cmake: '-DTRANSCRIBE_X86_CONSERVATIVE=ON -DGGML_SSE42=ON -DGGML_AVX=ON -DGGML_F16C=ON' }
          - { os: ubuntu-24.04-arm, target: linux-aarch64, triple: aarch64-unknown-linux-gnu, transcribe_cmake: '-DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      RELEASE_TARGET: ${{ matrix.target }}
      # Empty on Apple silicon: an empty value adds no CMake arguments.
      TRANSCRIBE_CMAKE_ARGS: ${{ matrix.transcribe_cmake }}
      # Optional macOS signing. When APPLE_CERTIFICATE is not set, the app gets
      # an ad-hoc signature instead (see docs/releasing.md).
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24 runtime)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24 runtime)
        with: { node-version: '22', cache: npm }
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          targets: ${{ matrix.triple }}
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libasound2-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf squashfs-tools xvfb dbus-x11 xdg-utils
      - run: npm ci
      - run: npm run test:release
      - name: Configure Apple signing keychain
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: node scripts/release/ci-apple.mjs
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      - name: Build installer
        run: node scripts/release/build.mjs
        env:
          # Signs the in-app update file. Without these secrets the installers still
          # build, but the release offers no automatic update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Remote access (docs/remote-access.md). Public values, kept as repository variables;
          # without them the build shows remote access as not configured.
          PANDACODE_RELAY_URL: ${{ vars.PANDACODE_RELAY_URL }}
          PANDACODE_GITHUB_CLIENT_ID: ${{ vars.PANDACODE_GITHUB_CLIENT_ID }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - name: Check packaged app startup (not GUI behavior)
        if: runner.os != 'macOS'
        timeout-minutes: 4
        run: node scripts/release/ci-startup-smoke.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pandacode-${{ needs.prepare.outputs.version }}-${{ matrix.target }}
          path: release/${{ needs.prepare.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
      - name: Remove Apple signing keychain
        if: always() && runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: node scripts/release/ci-apple.mjs cleanup

  # Release assurance (docs/releasing.md): SBOMs and scan coverage. Findings and tool
  # failures are reported in coverage or the job summary and never block the release.
  sbom:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SYFT_VERSION: '1.55.0'
      SYFT_SHA256: bb65249542db5fedeeb4d3f9b018b75e7264dbfbbb10486f044581a92f90490d
      GRYPE_VERSION: '0.121.0'
      GRYPE_SHA256: 64e07133d3486115de647a66581461dccf5c732748a0a3119077395565f15519
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24 runtime)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: assets
          pattern: pandacode-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
      - name: Install syft and grype (pinned, checksum verified)
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$HOME/.local/bin"
          cd "$RUNNER_TEMP/tools"
          for tool in syft grype; do
            ver_var=${tool^^}_VERSION; sum_var=${tool^^}_SHA256
            file="${tool}_${!ver_var}_linux_amd64.tar.gz"
            curl -fsSL --retry 3 --retry-max-time 300 --connect-timeout 15 --max-time 120 \
              -o "$file" "https://github.com/anchore/$tool/releases/download/v${!ver_var}/$file"
            echo "${!sum_var}  $file" | sha256sum -c -
            tar -xzf "$file" -C "$HOME/.local/bin" "$tool"
          done
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Generate SBOMs and scan coverage
        run: node scripts/release/sbom.mjs assets sbom "$VERSION" "$GITHUB_SHA"
      - name: Show coverage
        if: always()
        run: |
          if [ -s sbom/SBOM-COVERAGE.md ]; then
            cat sbom/SBOM-COVERAGE.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## SBOM/scan coverage unavailable' >> "$GITHUB_STEP_SUMMARY"
            echo 'No coverage report was produced. Check the artifact download, scanner installation and generation steps above; this release has no verified scan coverage.' >> "$GITHUB_STEP_SUMMARY"
            echo '::error::SBOM/scan coverage report is missing or empty.'
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pandacode-sbom-${{ needs.prepare.outputs.version }}
          path: sbom/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [prepare, build, sbom]
    # Publishing is an explicit manual action; tag pushes only build artifacts.
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
      RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
      RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
      RELEASE_TITLE: ${{ needs.prepare.outputs.release_title }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24 runtime)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: assets
          pattern: pandacode-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
      - name: Download SBOMs and scan coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: assets
          name: pandacode-sbom-${{ needs.prepare.outputs.version }}
      - name: Write release notes
        env:
          # A Developer ID signed build is notarized; an ad-hoc one is not, and
          # macOS then needs a step the notes have to name.
          SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
        run: |
          {
            cat "$RELEASE_NOTES"
            printf '\n\n'
            if [ "$SIGNED" = "true" ]; then node scripts/release/install-notes.mjs --signed; else node scripts/release/install-notes.mjs; fi
          } > "$RUNNER_TEMP/notes.md"
      - name: Write the updater manifest
        run: |
          if ls assets/*.sig >/dev/null 2>&1; then
            node scripts/release/updater-manifest.mjs assets "$VERSION" "$RELEASE_NOTES" "$RELEASE_TAG"
          else
            echo "::warning::No signed update files; this release will not update installed apps."
          fi
      - name: Create GitHub Release
        run: |
          ls -l assets
          gh release create "$RELEASE_TAG" assets/* \
            --title "$RELEASE_TITLE" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA"

