name: Source Snapshot Bridge (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/source-snapshots.yml

permissions:
  contents: read

jobs:
  source-snapshots:
    if: github.event.pull_request.head.ref == 'feat/0.6.0-upstream-0.3.49-0.3.50'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Archive exactly pinned public sources, without executing them
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p snapshots
          git archive --format=zip --output=snapshots/extended.zip HEAD
          for source in \
            "0.3.48:9cc1a9a58d259f7316e4f3ad621e8ca120358d89" \
            "0.3.49:e71acdda9eb5d488122081c4dbc49ee1a5b4f9e2" \
            "0.3.50:15541a51f3f5d8ee32d91349f9d5035a53c4cd19"
          do
            version="${source%%:*}"
            sha="${source##*:}"
            curl --fail --show-error --silent --location --retry 2 \
              --max-time 120 "https://api.github.com/repos/aicodeking/pandacode/zipball/${sha}" \
              --output "snapshots/upstream-${version}.zip"
          done
          (cd snapshots && sha256sum *.zip > SHA256SUMS)
          ls -lh snapshots/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pinned-source-snapshots
          path: snapshots/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
