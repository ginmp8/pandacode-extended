name: Temporary upstream reconciliation candidate validation
on:
  push:
    branches: [chore/pr120-reconcile-base-20261110]
permissions:
  contents: read
concurrency:
  group: temporary-reconciliation-candidate
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Freeze topic branch and reconstruct reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          echo "EXPECTED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          EXPECTED_HEAD="$(git rev-parse HEAD)" python3 scripts/temp-reconcile-03107.py
          git diff --cached --stat | tail -40
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and bundle
        run: npm run build
      - name: Node regression tests
        run: npm test
      - name: Release regression tests
        run: npm run test:release
      - name: Website build
        run: |
          npm ci --prefix website
          npm run site:build
