name: Temporary reconciliation conflict inspection
on:
  push:
    branches: [chore/pr120-reconcile-base-20261110]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare diagnostic virtual base
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Reconciliation Diagnostics"
          git config user.email "reconciliation@users.noreply.github.com"
          prev=4f777ec3414a9c46d07ea58debb99c87fcf4e74f
          source=50b2d8bfd25ba2f885a9f060bfb93fcc4111cc34
          target=6467995ea3b533b039bcd393e4e6a15e847f5464
          root=$(printf 'Virtual previously integrated upstream base\n' | git commit-tree "$(git rev-parse "$prev^{tree}")")
          head=$(printf 'Virtual upstream\n' | git commit-tree "$(git rev-parse "$source^{tree}")" -p "$root")
          dest=$(printf 'Virtual Extended\n' | git commit-tree "$(git rev-parse "$target^{tree}")" -p "$root")
          git switch -c temporary-reconciliation "$dest"
          git merge --no-commit --no-ff "$head" || true
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          python3 - "$RUNNER_TEMP/conflicts.txt" <<'PY'
          from pathlib import Path
          import sys
          paths=Path(sys.argv[1]).read_text().splitlines()
          print("CONFLICT_COUNT",len(paths))
          for filename in paths:
              if not filename.startswith(("src-tauri/src/", "src/", "src-tauri/Cargo", "package", "playwright")):
                  continue
              file=Path(filename)
              if not file.is_file(): continue
              data=file.read_text(errors="replace")
              blocks=data.split("<<<<<<< HEAD")
              print("FILE",filename,"BLOCKS",len(blocks)-1)
              for idx,raw in enumerate(blocks[1:],1):
                  conflict=raw.split(">>>>>>>",1)[0]
                  lines=conflict.splitlines()
                  print("BEGIN",filename,idx,"lines",len(lines))
                  if len(lines)>400:
                      lines=lines[:200]+["--- LARGE BLOCK TRUNCATED ---"]+lines[-60:]
                  for line in lines: print("CONFLICT_LINE",line[:270])
                  print("END",filename,idx)
          PY
