name: Temporary upstream reconciliation candidate validation
on:
  push:
    branches: [chore/pr120-reconcile-base-20261110]
permissions:
  contents: read
concurrency:
  group: temporary-reconciliation-candidate
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Reconstruct pinned candidate and verify tree inventory
        shell: bash
        run: EXPECTED_HEAD="$(git rev-parse HEAD)" python3 scripts/temp-reconcile-03107.py
      - run: npm ci
      - name: Typecheck and bundle
        run: npm run build
      - name: Node regression tests
        run: npm test
      - name: Release regression tests
        run: npm run test:release
      - name: Website build
        run: |
          npm ci --prefix website
          npm run site:build

  rust:
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Install native Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libdbus-1-dev libayatana-appindicator3-dev librsvg2-dev libfuse2 patchelf xvfb dbus-x11 xdg-utils
      - name: Reconstruct pinned candidate and verify tree inventory
        run: EXPECTED_HEAD="$(git rev-parse HEAD)" python3 scripts/temp-reconcile-03107.py
      - run: npm ci
      - run: npm run build
      - name: Full native Rust library regression
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Native Rust Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Reconstruct pinned candidate and verify tree inventory
        run: EXPECTED_HEAD="$(git rev-parse HEAD)" python3 scripts/temp-reconcile-03107.py
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Exercise upstream Skills Manager and Extended feature browser regressions
        run: |
          PANDACODE_TEST_CHROME="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')" \
          npx playwright test tests/skill-manager.spec.ts tests/skills-library.spec.ts tests/customize-skills.spec.ts tests/council.spec.ts tests/bots.spec.ts tests/bot-manifests.spec.ts tests/bot-collaboration.spec.ts tests/skills-library.spec.ts --workers=2
