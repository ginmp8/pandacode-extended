name: One-Time Upstream 0.3.49 Integration
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/upstream-0349-apply.yml]
permissions:
  contents: write
jobs:
  port:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/0.6.0-upstream-0.3.49-0.3.50'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: true
      - name: Apply pinned source deltas, preserving Extended guards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pinned"
          curl -fsSL --max-time 120 --retry 2 https://api.github.com/repos/aicodeking/pandacode/zipball/9cc1a9a58d259f7316e4f3ad621e8ca120358d89 -o "$RUNNER_TEMP/pinned/old.zip"
          curl -fsSL --max-time 120 --retry 2 https://api.github.com/repos/aicodeking/pandacode/zipball/e71acdda9eb5d488122081c4dbc49ee1a5b4f9e2 -o "$RUNNER_TEMP/pinned/new.zip"
          python3 - <<'PY'
          from pathlib import Path
          import os, zipfile, subprocess, shutil
          here = Path.cwd()
          cache = Path(os.environ['RUNNER_TEMP'])/'pinned'
          skip = {'package.json','package-lock.json','playwright.config.ts','src-tauri/Cargo.lock','src-tauri/Cargo.toml','src-tauri/tauri.conf.json','website/src/data/release-dates.json','docs/remote-access.md','src-tauri/src/cloud_agents.rs','releases/0.3.49.md'}
          theirs = {'src-tauri/src/remote/host.rs','src-tauri/src/remote/mirror.rs','src-tauri/src/remote/socket.rs','src-tauri/src/remote/start.rs'}
          def extract(label):
              root = cache/label
              root.mkdir()
              with zipfile.ZipFile(cache/(label+'.zip')) as z:
                  members = z.infolist()
                  if len(members)>5000: raise RuntimeError('Too many source entries')
                  for member in members:
                      parts=Path(member.filename).parts
                      if member.is_dir() or len(parts)<2: continue
                      if member.filename.startswith('/') or '..' in parts or (member.external_attr >> 16)&0o170000==0o120000 or member.file_size>20000000: raise RuntimeError('Unsafe upstream source')
                      target=root.joinpath(*parts[1:])
                      if not target.resolve().is_relative_to(root.resolve()): raise RuntimeError('Path traversal')
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(z.read(member))
              return root
          old,new=extract('old'),extract('new')
          changed,added=[],[]
          for source in sorted(new.rglob('*')):
              if not source.is_file():continue
              name=source.relative_to(new).as_posix()
              prior=old/name
              target=here/name
              if name in skip or (prior.exists() and prior.read_bytes()==source.read_bytes()):continue
              if not prior.exists():
                  if not target.exists():
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(source,target);added.append(name)
                  continue
              if not target.exists():continue
              args=['git','merge-file','-p','--theirs' if name in theirs else '--ours',str(target),str(prior),str(source)]
              result=subprocess.run(args,capture_output=True)
              if result.returncode:raise RuntimeError(f'Cannot merge {name}: {result.stderr.decode(errors="replace")}')
              if result.stdout!=target.read_bytes():
                  target.write_bytes(result.stdout);changed.append(name)
          def edit(path,old,new):
              target=here/path
              data=target.read_text()
              if data.count(old)!=1:raise RuntimeError(f'Anchor mismatch {path}: {old[:70]}')
              target.write_text(data.replace(old,new,1))
          edit('src-tauri/src/remote.rs','mod replay;\nmod socket;','mod replay;\nmod routes;\nmod socket;')
          edit('src-tauri/src/remote.rs','    flushing: bool,\n    replay: replay::Replay,','    flushing: bool,\n    flushed_at: Option<Instant>,\n    flush_frames: u32,\n    journal: host::Journal,\n    viewer: mirror::Viewer,\n    replay: replay::Replay,')
          edit('src-tauri/src/remote.rs','        self.subscribers.clear();\n','        self.subscribers.clear();\n        self.viewer = Default::default();\n')
          for path in ['src-tauri/src/remote/host.rs','src-tauri/src/remote/socket.rs','src-tauri/src/remote/config.rs','src-tauri/src/remote.rs']:
              target=here/path
              data=target.read_text().replace('.remote_full_access','.allow_full_access')
              target.write_text(data)
          edit('src-tauri/src/storage.rs','pub const SCHEMA_VERSION: i64 = 29;','pub const SCHEMA_VERSION: i64 = 31;')
          edit('src-tauri/Cargo.toml','shell-words = "1"\n','shell-words = "1"\nif-addrs = "=0.15.0"\n')
          assert 'allow_full_access' in (here/'src-tauri/src/remote/host.rs').read_text()
          assert 'grants::check' in (here/'src-tauri/src/remote/socket.rs').read_text()
          assert 'is_trusted' in (here/'src-tauri/src/remote.rs').read_text()
          print('CHANGED',len(changed),changed,'ADDED',len(added),added)
          PY
          git diff --check
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(connect): integrate pinned upstream 0.3.49 workflows'
          git push origin HEAD:refs/heads/feat/0.6.0-upstream-0.3.49-0.3.50
