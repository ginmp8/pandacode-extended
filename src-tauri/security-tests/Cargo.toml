[package]
name = "pandacode-security-regressions"
version = "0.1.0"
edition = "2021"
publish = false

# Keep these focused checks independent of the desktop application and its build.
[workspace]

[dependencies]
glib = { path = "../vendor/glib" }
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
